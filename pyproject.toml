[project]
name = "agentcore-gateway"
version = "0.1.0"
description = "A Strands agent on AgentCore Runtime whose tools arrive only through AgentCore Gateway."
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.63.0",
    "bedrock-agentcore>=1.25.2",
    "boto3>=1.34.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.29.0",
    "aws-cdk-lib>=2.275.0",
    "constructs>=10.0.0",
]

[project.optional-dependencies]
# Only the runtime image needs the ADOT distro; local runs export directly.
otel = ["aws-opentelemetry-distro>=0.18.0"]
# Only the Phoenix comparison needs these; never installed in the runtime image.
evals = ["arize-phoenix-evals>=3.9.5", "litellm>=1.80.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
