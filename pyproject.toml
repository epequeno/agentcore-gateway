[project]
name = "agentcore-gateway"
version = "0.1.0"
description = "A Strands agent on AgentCore Runtime whose tools arrive only through AgentCore Gateway."
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.60.0",
    "bedrock-agentcore>=1.24.0",
    "mcp-proxy-for-aws>=1.7.0",
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.29.0",
    "aws-cdk-lib>=2.240.0",
    "constructs>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
